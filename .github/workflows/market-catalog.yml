name: Validate market catalog

on:
  pull_request:
    paths:
      - market/catalog-v1.json
      - scripts/validate-market-catalog.mjs
      - .github/workflows/market-catalog.yml
  push:
    branches:
      - main
    paths:
      - market/catalog-v1.json
      - scripts/validate-market-catalog.mjs
      - .github/workflows/market-catalog.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node scripts/validate-market-catalog.mjs
