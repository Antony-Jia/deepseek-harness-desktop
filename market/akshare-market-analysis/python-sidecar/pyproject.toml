[project]
name = "dsh-akshare-sidecar"
version = "0.1.0"
description = "Loopback-only AKShare service for the DSH market plugin"
requires-python = ">=3.11,<3.12"
dependencies = [
  "akshare==1.18.40",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "curl-cffi>=0.7,<1",
  "lxml>=5,<6"
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "pyinstaller>=6.11,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
